<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18261e"><title>My Garden</title>
<style>
:root{--ink:#f7edd7;--panel:#192920;--panel2:#243b2d;--line:#506b55;--gold:#efc66f;--muted:#a7b7a9;--dark:#0c1510;--red:#d98678}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--dark);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}.hud{display:flex;background:var(--panel);border-bottom:2px solid #314a39;padding:calc(6px + env(safe-area-inset-top)) 6px 6px;z-index:8}.stat{flex:1;text-align:center;border-right:1px solid #38513f;padding:3px}.stat:last-child{border:0}.stat b{display:block;color:#fff0c7;font-size:13px}.stat small{color:#9fb1a2;font-size:8px}.worldwrap{position:relative;overflow:hidden;touch-action:none;background:#2a4735}.world{position:absolute;width:1800px;height:1200px;transform-origin:0 0;background:#547b4e;overflow:hidden}.world:before{content:"";position:absolute;inset:0;opacity:.12;background-image:linear-gradient(45deg,#173423 25%,transparent 25%),linear-gradient(-45deg,#173423 25%,transparent 25%);background-size:22px 22px}.dirt{position:absolute;left:20px;top:20px;width:1760px;height:1160px;border:5px solid #365b3d;border-radius:40px;box-shadow:inset 0 0 0 14px #4c7048}.path{position:absolute;background:#bda274;border:4px solid #8d754f;border-radius:40px;opacity:.7}.p1{left:120px;top:520px;width:1500px;height:48px;transform:rotate(1deg)}.p2{left:820px;top:100px;width:48px;height:900px;transform:rotate(-3deg)}.zone{position:absolute;border:3px dashed rgba(255,255,255,.13);border-radius:28px}.zt{position:absolute;top:-21px;left:14px;background:#21392a;border:2px solid #526f55;padding:4px 8px;border-radius:5px;font-size:11px;color:#f7df9f;box-shadow:3px 3px #17251c;white-space:nowrap}.people{left:80px;top:100px;width:570px;height:340px}.moments{left:80px;top:650px;width:570px;height:350px}.botanical{left:720px;top:100px;width:510px;height:340px}.thoughts{left:1250px;top:650px;width:450px;height:350px}.journal{left:720px;top:790px;width:470px;height:210px}.building{position:absolute;border:7px solid #3c2c25;box-shadow:7px 7px #18251c;border-radius:5px;text-align:center;color:#38281f;user-select:none}.building .sign{position:absolute;left:50%;transform:translateX(-50%);top:10px;white-space:nowrap;background:#e5c888;border:3px solid #6e4e36;padding:4px 9px;font-weight:bold;font-size:10px}.library{left:1370px;top:120px;width:250px;height:190px;background:#78503a}.library:after{content:"📚";font-size:76px;position:absolute;left:78px;top:62px}.workshop{left:1370px;top:360px;width:250px;height:165px;background:#896b47}.workshop:after{content:"🛠️ ✂️";font-size:40px;position:absolute;left:52px;top:70px}.object{position:absolute;transform:translate(-50%,-50%);filter:drop-shadow(3px 4px rgba(12,22,16,.45));user-select:none;z-index:3}.object button{border:0;background:none;font-size:44px;padding:4px;min-width:52px;min-height:52px}.object.tree button{font-size:76px}.label{position:absolute;left:50%;top:48px;transform:translateX(-50%);white-space:nowrap;background:#142019df;border:1px solid #4b674f;border-radius:5px;padding:3px 5px;font-size:8px;max-width:125px;overflow:hidden;text-overflow:ellipsis}.tree .label{top:72px}.fruit{position:absolute;font-size:18px;pointer-events:none}.f0{left:12px;top:9px}.f1{right:10px;top:17px}.f2{left:34px;top:-2px}.f3{right:31px;top:0}.f4{left:44px;top:27px}.placed{position:absolute;transform:translate(-50%,-50%);font-size:42px;z-index:4;filter:drop-shadow(3px 4px rgba(0,0,0,.3));user-select:none}.placed.editing{outline:3px dashed #f4cf78;border-radius:10px;background:#ffffff12}.nav{display:grid;grid-template-columns:repeat(5,1fr);background:#142019;border-top:2px solid #314839;padding-bottom:env(safe-area-inset-bottom);z-index:10}.nav button{border:0;background:none;color:#dae4d7;min-height:56px;font-size:9px}.nav .plant{color:#ffd276;font-weight:bold}.quick{position:absolute;right:15px;bottom:15px;width:60px;height:60px;border-radius:50%;background:var(--gold);border:3px solid #806536;color:#30281b;font-size:28px;z-index:7;box-shadow:4px 4px #17241c}.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#142019dc;border:1px solid #506a54;border-radius:12px;padding:6px 10px;font-size:9px;z-index:6;pointer-events:none}.modalback{position:fixed;inset:0;background:#07100be8;display:none;align-items:end;z-index:30}.modalback.show{display:flex}.modal{width:100%;max-height:92dvh;overflow:auto;background:#1c2d23;border-top:3px solid #526e57;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px #08100b}.modal h2{font-family:Georgia,serif;margin:0 0 5px;font-size:24px}.modal h3{margin:18px 0 8px}.sub,.muted{color:var(--muted);font-size:11px}.form{display:grid;gap:13px;margin-top:15px}.form label{display:grid;gap:5px;font-size:11px}.form input,.form textarea,.form select{width:100%;font-size:16px;background:#101b15;color:var(--ink);border:2px solid #415e49;border-radius:8px;padding:12px}.form textarea{min-height:105px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.chip{border:1px solid #58745d;background:#294334;color:#e8eadf;border-radius:16px;padding:7px 10px;font-size:11px}.chip.on{background:#e6bd68;color:#2b2519;border-color:#806536}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;position:sticky;bottom:0;background:#1c2d23;padding-top:8px;z-index:2}.actions button,.choice{min-height:44px;border:2px solid #54715a;border-radius:8px;background:#294535;color:#f5ead2;padding:9px 12px}.actions .primary,.primary{background:#e9bd62!important;color:#292217!important;border-color:#806532!important}.card{background:#142019;border:1px solid #3d5643;border-radius:8px;padding:12px;margin:9px 0}.card.click{cursor:pointer}.tag{display:inline-block;background:#2b4636;border:1px solid #54715a;border-radius:12px;padding:4px 7px;font-size:10px;margin:2px}.empty{text-align:center;color:#9aab9c;padding:28px 8px}.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:#efc568;color:#292217;border:3px solid #795f33;border-radius:9px;padding:10px 14px;z-index:40;font-weight:bold;transition:.25s;max-width:90%;text-align:center}.toast.show{transform:translateX(-50%) translateY(0)}.danger{color:#ffc0b5!important}.filename{font-size:10px;color:#d7c99e;margin-top:5px}.quote{font-family:Georgia,serif;font-size:16px;line-height:1.4}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap;border:1px solid #58745d;background:#294334;color:#eee0c6;border-radius:14px;padding:7px 10px}.tabs button.on{background:#e6bd68;color:#2b2519}.money{color:#f2c66d}.bookrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.pile{font-size:44px;text-align:center;padding:15px;background:#3a3027;border-radius:10px}.shelf{border-bottom:8px solid #6c4b35;padding:8px 4px}.stars{font-size:20px;letter-spacing:2px}.shopgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.shopitem{text-align:center;background:#142019;border:1px solid #3d5643;border-radius:10px;padding:12px}.shopitem .emoji{font-size:38px}.shopitem button{width:100%;margin-top:7px}.toggle{display:flex;gap:6px}.toggle button{flex:1}.botanical-bed{position:absolute;border-radius:30px;opacity:.18;pointer-events:none}.bscience{left:740px;top:130px;width:145px;height:130px;background:#68b5d2}.bhistory{left:900px;top:130px;width:145px;height:130px;background:#b99a68}.bart{left:1060px;top:130px;width:145px;height:130px;background:#d878a3}.bpop{left:740px;top:280px;width:145px;height:130px;background:#d7c84d}.blanguage{left:900px;top:280px;width:145px;height:130px;background:#8dbb72}.bsociety{left:1060px;top:280px;width:145px;height:130px;background:#9277b7}@media(min-width:800px){.modalback{align-items:center;justify-content:center;padding:20px}.modal{width:min(720px,100%);border:3px solid #526e57;border-radius:14px}.nav{grid-template-columns:repeat(5,140px);justify-content:center}.hud{justify-content:center}.stat{max-width:180px}.shopgrid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="app"><div class="hud"><div class="stat"><b id="streak">🔥 0</b><small>day streak</small></div><div class="stat"><b id="balance">🪙 0</b><small>balance</small></div><div class="stat"><b id="earned">0</b><small>all-time earned</small></div><div class="stat"><b id="count">0</b><small>notes</small></div></div><div class="worldwrap" id="wrap"><div class="world" id="world"><div class="dirt"></div><div class="path p1"></div><div class="path p2"></div><div class="zone people"><span class="zt">🌳 PEOPLE ORCHARD</span></div><div class="zone moments"><span class="zt">🌺 MOMENTS & QUOTES</span></div><div class="zone botanical"><span class="zt">🌿 BOTANICAL GARDEN · LEARNING</span></div><div class="botanical-bed bscience"></div><div class="botanical-bed bhistory"></div><div class="botanical-bed bart"></div><div class="botanical-bed bpop"></div><div class="botanical-bed blanguage"></div><div class="botanical-bed bsociety"></div><div class="zone thoughts"><span class="zt">🍄 THOUGHTS</span></div><div class="zone journal"><span class="zt">🌼 JOURNAL MEADOW</span></div><div class="building library" onclick="openLibrary()"><span class="sign">THE LIBRARY</span></div><div class="building workshop" onclick="openWorkshop()"><span class="sign">WORKSHOP</span></div><div id="objects"></div><div id="decor"></div></div><div class="hint" id="hint">Drag to wander · pinch to zoom</div><button class="quick" onclick="openPlant()">＋</button></div><nav class="nav"><button onclick="fit()">🏡<br>Garden</button><button class="plant" onclick="openPlant()">🌱<br>Plant</button><button onclick="openShop()">🛒<br>Shop</button><button onclick="openInventory()">🎒<br>Inventory</button><button onclick="openMenu()">☰<br>More</button></nav></div><div class="modalback" id="modalback"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const TYPES={person:{label:'Person',icon:'🌳',prefix:''},moment:{label:'Moment',icon:'🌺',prefix:'Moment – '},quote:{label:'Quote',icon:'💬',prefix:'Quote – '},thought:{label:'Thought',icon:'🍄',prefix:'Thought – '},learning:{label:'Something I learned',icon:'🌿',prefix:'Learning – '},project:{label:'Project',icon:'🛠️',prefix:'Project – '},book:{label:'Book',icon:'📕',prefix:'Book – '},journal:{label:'Journal',icon:'🌼',prefix:'Journal – '}};
const DEFAULT_SUGGEST={person:['Kids','Family','Friends','Coworkers','Acquaintances','Community & Professionals','Other'],moment:['Funny','Sweet','Weird','Chaotic','Awkward','Important','Family','Friends','Parenting','Work','Self'],quote:['Funny','Sweet','Weird','Chaotic','Kids','Family','Friends','Work'],thought:['Self','People','Society','Language','Art','Pop Culture','Work','Parenting','Wordplay'],learning:['Science','History','Art','Pop Culture','Language','Psychology','Society','Technology','Food','Culture'],project:['Art','Writing','Zines','Home','Work','Self'],book:['Fiction','Non-fiction','History','Science','Art','Pop Culture','Psychology','Society'],journal:['Self','Family','Friends','Parenting','Work','Art']};
const PERSON_TREES={'Kids':'🌸','Family':'🌳','Friends':'🌲','Coworkers':'🌴','Acquaintances':'🌵','Community & Professionals':'🌿','Other':'🌳'};
const LEARN_PLANTS={Science:'🪴',History:'🌾',Art:'🌺','Pop Culture':'🌻',Language:'🌱',Society:'🌿',default:'🌷'};
const SHOP=[
{id:'grass',name:'Grass patch',icon:'🌱',price:10,cat:'Plants'},{id:'flowers',name:'Wildflowers',icon:'🌼',price:25,cat:'Plants'},{id:'shrub',name:'Shrub',icon:'🌿',price:20,cat:'Plants'},{id:'mushdecor',name:'Decorative mushrooms',icon:'🍄',price:25,cat:'Plants'},{id:'tree',name:'Decorative tree',icon:'🌳',price:50,cat:'Plants'},{id:'blossom',name:'Flowering tree',icon:'🌸',price:75,cat:'Plants'},
{id:'bench',name:'Bench',icon:'🪑',price:40,cat:'Furniture'},{id:'birdbath',name:'Birdbath',icon:'⛲',price:75,cat:'Furniture'},{id:'sign',name:'Signpost',icon:'🪧',price:30,cat:'Furniture'},{id:'lamp',name:'Lantern',icon:'🏮',price:30,cat:'Furniture'},{id:'picnic',name:'Picnic table',icon:'🧺',price:60,cat:'Furniture'},
{id:'butterfly',name:'Butterfly',icon:'🦋',price:30,cat:'Animals'},{id:'bee',name:'Bee',icon:'🐝',price:40,cat:'Animals'},{id:'snail',name:'Snail',icon:'🐌',price:50,cat:'Animals'},{id:'frog',name:'Frog',icon:'🐸',price:75,cat:'Animals'},{id:'bird',name:'Bird',icon:'🐦',price:100,cat:'Animals'},{id:'rabbit',name:'Rabbit',icon:'🐇',price:150,cat:'Animals'},{id:'duck',name:'Duck',icon:'🦆',price:200,cat:'Animals',nameable:true},{id:'cat',name:'Cat',icon:'🐈',price:500,cat:'Animals',nameable:true},{id:'peacock',name:'Peacock',icon:'🦚',price:1000,cat:'Animals',nameable:true},
{id:'pond',name:'Small pond',icon:'💧',price:150,cat:'Water'},{id:'bridge',name:'Little bridge',icon:'🌉',price:100,cat:'Water'},{id:'fountain',name:'Fountain',icon:'⛲',price:400,cat:'Water'},
{id:'gazebo',name:'Gazebo',icon:'🏛️',price:300,cat:'Structures'},{id:'treehouse',name:'Treehouse',icon:'🛖',price:500,cat:'Structures'},
{id:'gnome',name:'Garden gnome',icon:'🧙',price:69,cat:'Stupid Shit'},{id:'flamingo',name:'Flamingo',icon:'🦩',price:69,cat:'Stupid Shit'},{id:'rock',name:'Suspicious rock',icon:'🪨',price:50,cat:'Stupid Shit'},{id:'dino',name:'Tiny dinosaur',icon:'🦖',price:150,cat:'Stupid Shit'},{id:'alien',name:'Alien behind a bush',icon:'👽',price:250,cat:'Stupid Shit'},{id:'hatduck',name:'Duck wearing a hat',icon:'🦆',price:500,cat:'Stupid Shit'}];
const bounds={people:[130,610,145,410],moments:[130,610,700,970],botanical:[760,1190,145,410],thought:[1290,1660,700,970],journal:[760,1150,830,970]};
const STORAGE='garden_game_v3';let state=load(),selected=[],pan={x:0,y:0,scale:.55},drag=null,placing=null,editWorld=false;
function fresh(){return{items:[],balance:0,totalEarned:0,inventory:[],placed:[],log:[],lastNoteDay:null,streak:0,settings:{suggest:JSON.parse(JSON.stringify(DEFAULT_SUGGEST))},rewards:{}}}
function load(){try{let s=JSON.parse(localStorage.getItem(STORAGE));return s&&Array.isArray(s.items)?Object.assign(fresh(),s):fresh()}catch{return fresh()}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s=''){return s.trim().toLowerCase()}
function dayKey(ts=Date.now()){let d=new Date(ts);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function uuid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
function earn(n,msg){state.balance+=n;state.totalEarned+=n;state.log.unshift({at:Date.now(),msg:`+${n} coins · ${msg}`});toast(`🪙 +${n} · ${msg}`)}
function noteStreak(){let today=dayKey();if(state.lastNoteDay===today)return;let y=new Date();y.setDate(y.getDate()-1);state.streak=state.lastNoteDay===dayKey(y)?state.streak+1:1;state.lastNoteDay=today}
function extractWiki(text=''){return[...text.matchAll(/\[\[([^\]|#]+)(?:[|#][^\]]*)?\]\]/g)].map(m=>m[1].trim()).filter(Boolean)}
function unique(a){return[...new Map(a.filter(Boolean).map(x=>[norm(x),x])).values()]}
function allLinks(x){return unique([...(x.links||[]),...extractWiki(x.body||'')])}
function filenameFor(type,title,author=''){if(type==='journal')return `Journal – ${dayKey()}.md`;if(type==='book')return `Book – ${title}${author?' – '+author:''}.md`;return (TYPES[type].prefix+title+'.md').replace(/[\\/:*?"<>|]/g,'-')}
function position(i,type){let b=bounds[type==='person'?'people':type==='learning'?'botanical':type==='thought'?'thought':type==='journal'?'journal':'moments']||bounds.moments;let cols=type==='person'?5:4,c=i%cols,r=Math.floor(i/cols);return{x:b[0]+55+c*((b[1]-b[0]-70)/(cols-1||1)),y:b[2]+55+(r%4)*72}}
function personCategory(x){return (x.links||[]).find(l=>PERSON_TREES[l])||'Other'}
function fruitFor(person){let n=norm(person.title);return state.items.filter(x=>['moment','quote'].includes(x.type)&&allLinks(x).some(l=>norm(l)===n))}
function fruitIcon(x){let funny=allLinks(x).some(l=>norm(l)==='funny');if(x.type==='moment')return funny?'🍏':'🍎';if(x.type==='quote')return funny?'🍋':'🍊';return'🍎'}
function learnBroad(x){return ['Science','History','Art','Pop Culture','Language','Society'].find(k=>allLinks(x).some(l=>norm(l)===norm(k)))||'default'}
function render(){document.getElementById('streak').textContent=`🔥 ${state.streak}`;document.getElementById('balance').textContent=`🪙 ${state.balance}`;document.getElementById('earned').textContent=state.totalEarned;document.getElementById('count').textContent=state.items.length;let o=document.getElementById('objects');o.innerHTML='';let visible=state.items.filter(x=>!['book','project'].includes(x.type));visible.forEach((x,i)=>{let same=visible.filter(y=>y.type===x.type),idx=same.indexOf(x),p=position(idx,x.type),icon=TYPES[x.type].icon,cls='object';if(x.type==='person'){icon=PERSON_TREES[personCategory(x)]||'🌳';cls+=' tree'}if(x.type==='learning')icon=LEARN_PLANTS[learnBroad(x)]||LEARN_PLANTS.default;let el=document.createElement('div');el.className=cls;el.style.left=p.x+'px';el.style.top=p.y+'px';let fruits='';if(x.type==='person')fruitFor(x).slice(0,5).forEach((f,j)=>fruits+=`<span class="fruit f${j}">${fruitIcon(f)}</span>`);el.innerHTML=`<button onclick="openItem('${x.id}')">${icon}</button>${fruits}<span class="label">${esc(x.title)}</span>`;o.appendChild(el)});let d=document.getElementById('decor');d.innerHTML='';state.placed.forEach(p=>{let it=SHOP.find(s=>s.id===p.itemId);if(!it)return;let e=document.createElement('div');e.className='placed'+(editWorld?' editing':'');e.style.left=p.x+'px';e.style.top=p.y+'px';e.innerHTML=it.icon;e.onclick=()=>editWorld?placedMenu(p.id):null;d.appendChild(e)})}
function show(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalback').classList.add('show')}
function closeAll(){document.getElementById('modalback').classList.remove('show')}
document.getElementById('modalback').onclick=e=>{if(e.target.id==='modalback')closeAll()}
function openPlant(type='thought'){selected=[];let opts=Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===type?'selected':''}>${v.icon} ${v.label}</option>`).join('');show(`<h2>Plant something 🌱</h2><div class="sub">One type. Any number of connections. Simple now; Markdown when you want it.</div><div class="form"><label>Type<select id="ptype" onchange="plantFormChanged()">${opts}</select></label><div id="dynamicFields"></div><label id="titleWrap">Title<input id="ptitle" placeholder="Short, distinctive title" oninput="previewFilename()"></label><label>Notes <button type="button" class="chip" id="mdToggle" onclick="toggleMarkdown()">⌨️ Markdown mode</button><textarea id="pbody" placeholder="One sentence is enough. You can type [[wikilinks]] here too."></textarea></label><div><label>Suggested connections</label><div class="chips" id="chips"></div></div><label>Add connection<input id="customLink" placeholder="e.g. New Zealand" onkeydown="if(event.key==='Enter'){event.preventDefault();addCustom()}"></label><div class="chips" id="chosen"></div><div class="filename" id="filename"></div></div><div class="actions"><button onclick="closeAll()">Cancel</button><button class="primary" onclick="plant()">Plant it</button></div>`);plantFormChanged()}
function toggleMarkdown(){let t=document.getElementById('pbody'),b=document.getElementById('mdToggle');t.style.minHeight=t.style.minHeight==='240px'?'105px':'240px';b.textContent=t.style.minHeight==='240px'?'✓ Markdown mode':'⌨️ Markdown mode';t.placeholder='Markdown supported: headings, lists, and [[wikilinks]].'}
function plantFormChanged(){let type=document.getElementById('ptype').value,d=document.getElementById('dynamicFields');let html='';if(type==='person')html=`<label>Person group<select id="personGroup">${Object.keys(PERSON_TREES).map(x=>`<option>${x}</option>`).join('')}</select></label>`;if(type==='quote')html=`<label>Who said it?<input id="pwho" placeholder="Person name"></label>`;if(type==='book')html=`<label>Author<input id="pauthor" placeholder="Author"></label><label>Status<select id="pbookstatus"><option value="tbr">To be read</option><option value="finished">Finished</option></select></label><label>Date finished<input id="pfinished" type="date"></label><label>Rating (optional)<select id="prating"><option value="">Not rated</option>${Array.from({length:10},(_,i)=>{let v=(i+1)/2;return `<option value="${v}">${v} / 5</option>`}).join('')}</select></label>`;if(type==='project')html=`<label>Project status<select id="pprojectstatus"><option value="idea">Idea</option><option value="progress">In progress</option><option value="hold">On hold</option><option value="finished">Finished</option><option value="abandoned">Abandoned</option></select></label>`;d.innerHTML=html;refreshSuggestions();previewFilename()}
function refreshSuggestions(){let type=document.getElementById('ptype').value,arr=state.settings.suggest[type]||[];document.getElementById('chips').innerHTML=arr.map(x=>`<button class="chip ${selected.includes(x)?'on':''}" onclick="toggleLink('${x.replace(/'/g,"\\'")}')">${esc(x)}</button>`).join('');renderChosen()}
function toggleLink(x){selected.includes(x)?selected=selected.filter(a=>a!==x):selected.push(x);refreshSuggestions()}
function addCustom(){let el=document.getElementById('customLink'),x=el.value.trim();if(x&&!selected.some(a=>norm(a)===norm(x)))selected.push(x);el.value='';refreshSuggestions()}
function renderChosen(){let e=document.getElementById('chosen');if(e)e.innerHTML=selected.map(x=>`<button class="chip on" onclick="toggleLink('${x.replace(/'/g,"\\'")}')">[[${esc(x)}]] ×</button>`).join('')}
function previewFilename(){let type=document.getElementById('ptype')?.value,title=document.getElementById('ptitle')?.value.trim(),author=document.getElementById('pauthor')?.value.trim()||'';let e=document.getElementById('filename');if(e&&title)e.textContent=`Obsidian filename: ${filenameFor(type,title,author)}`}
function plant(){addCustom();let type=document.getElementById('ptype').value,title=document.getElementById('ptitle').value.trim(),body=document.getElementById('pbody').value.trim();if(type==='journal'){let existing=state.items.find(x=>x.type==='journal'&&x.date===dayKey());if(existing)return toast('Today already has a journal note — open and edit it instead');if(!title)title=dayKey()}if(!title)return toast('Give it a title');let links=[...selected],item={id:uuid(),type,title,body,links,created:Date.now(),date:dayKey()};if(type==='person'){item.personGroup=document.getElementById('personGroup').value;if(!links.includes(item.personGroup))links.unshift(item.personGroup)}if(type==='quote'){let who=document.getElementById('pwho').value.trim();if(who&&!links.some(x=>norm(x)===norm(who)))links.unshift(who)}if(type==='book'){item.author=document.getElementById('pauthor').value.trim();item.bookStatus=document.getElementById('pbookstatus').value;item.dateFinished=document.getElementById('pfinished').value;item.rating=parseFloat(document.getElementById('prating').value)||null;item.rewardedFinished=item.bookStatus==='finished';if(item.bookStatus==='finished')earn(50,'Book finished')}if(type==='project'){item.projectStatus=document.getElementById('pprojectstatus').value;item.rewardedFinished=item.projectStatus==='finished';if(item.projectStatus==='finished')earn(50,'Project finished')}item.filename=filenameFor(type,title,item.author||'');state.items.push(item);if(type==='journal')earn(10,'Daily journal');else if(!['book','project'].includes(type))earn(5,`${TYPES[type].label} added`);else if(type==='book'&&item.bookStatus!=='finished'){}else if(type==='project'&&item.projectStatus!=='finished'){}let newConnections=unique([...links,...extractWiki(body)]).length;if(newConnections)earn(newConnections,'Connections added');noteStreak();save();closeAll();setTimeout(()=>openItem(item.id),120)}
function stars(r){if(!r)return'Not rated';let full=Math.floor(r),half=r%1?1:0;return'★'.repeat(full)+(half?'½':'')+'☆'.repeat(5-full-half)}
function openItem(id){let x=state.items.find(i=>i.id===id);if(!x)return;let links=allLinks(x).map(l=>`<span class="tag">[[${esc(l)}]]</span>`).join('')||'<span class="muted">No connections yet.</span>';let extra='';if(x.type==='person'){let fs=fruitFor(x);extra=`<div class="card"><b>${PERSON_TREES[personCategory(x)]} ${esc(personCategory(x))}</b><div class="muted">${fs.length} fruit</div>${fs.map(f=>`<div style="margin-top:8px" onclick="openItem('${f.id}')">${fruitIcon(f)} ${esc(f.title)} <span class="muted">· ${TYPES[f.type].label}</span></div>`).join('')||'<div class="muted" style="margin-top:8px">Moments and quotes linked to this person grow as fruit.</div>'}</div>`}if(x.type==='book')extra=`<div class="card"><b>${esc(x.author||'Unknown author')}</b><div>${x.bookStatus==='finished'?'Finished':'To be read'}${x.dateFinished?' · '+esc(x.dateFinished):''}</div><div class="stars">${stars(x.rating)}</div></div>`;if(x.type==='project')extra=`<div class="card">Status: <b>${esc(projectLabel(x.projectStatus))}</b></div>`;show(`<h2>${TYPES[x.type].icon} ${esc(x.title)}</h2><div class="sub">${TYPES[x.type].label}</div><div class="filename">${esc(x.filename)}</div>${extra}<div class="card ${x.type==='quote'?'quote':''}">${formatBody(x.body||'Nothing else written yet.')}</div><div>${links}</div><div class="actions"><button class="danger" onclick="removeItem('${id}')">Remove</button><button onclick="editItem('${id}')">Edit</button></div>`)}
function formatBody(s){return esc(s).replace(/\[\[([^\]]+)\]\]/g,'<span class="tag">[[$1]]</span>').replace(/\n/g,'<br>')}
function projectLabel(s){return({idea:'Idea',progress:'In progress',hold:'On hold',finished:'Finished',abandoned:'Abandoned'})[s]||'Idea'}
function editItem(id){let x=state.items.find(i=>i.id===id),special='';if(x.type==='book')special=`<label>Author<input id="eauthor" value="${esc(x.author||'')}"></label><label>Status<select id="ebookstatus"><option value="tbr" ${x.bookStatus==='tbr'?'selected':''}>To be read</option><option value="finished" ${x.bookStatus==='finished'?'selected':''}>Finished</option></select></label><label>Date finished<input id="efinished" type="date" value="${esc(x.dateFinished||'')}"></label><label>Rating<select id="erating"><option value="">Not rated</option>${Array.from({length:10},(_,i)=>{let v=(i+1)/2;return `<option value="${v}" ${x.rating===v?'selected':''}>${v} / 5</option>`}).join('')}</select></label>`;if(x.type==='project')special=`<label>Status<select id="eprojectstatus">${['idea','progress','hold','finished','abandoned'].map(v=>`<option value="${v}" ${x.projectStatus===v?'selected':''}>${projectLabel(v)}</option>`).join('')}</select></label>`;show(`<h2>Edit ${esc(TYPES[x.type].label)}</h2><div class="form"><label>Title<input id="etitle" value="${esc(x.title)}"></label>${special}<label>Notes<textarea id="ebody">${esc(x.body||'')}</textarea></label><label>Connections<input id="elinks" value="${esc((x.links||[]).join(', '))}"></label></div><div class="actions"><button onclick="openItem('${id}')">Cancel</button><button class="primary" onclick="saveEdit('${id}')">Save</button></div>`)}
function saveEdit(id){let x=state.items.find(i=>i.id===id),oldLinks=allLinks(x);x.title=document.getElementById('etitle').value.trim()||x.title;x.body=document.getElementById('ebody').value;x.links=document.getElementById('elinks').value.split(',').map(a=>a.trim()).filter(Boolean);if(x.type==='book'){x.author=document.getElementById('eauthor').value.trim();x.bookStatus=document.getElementById('ebookstatus').value;x.dateFinished=document.getElementById('efinished').value;x.rating=parseFloat(document.getElementById('erating').value)||null;if(x.bookStatus==='finished'&&!x.rewardedFinished){earn(50,'Book finished');x.rewardedFinished=true}}if(x.type==='project'){x.projectStatus=document.getElementById('eprojectstatus').value;if(x.projectStatus==='finished'&&!x.rewardedFinished){earn(50,'Project finished');x.rewardedFinished=true}}x.filename=filenameFor(x.type,x.title,x.author||'');let added=allLinks(x).filter(l=>!oldLinks.some(o=>norm(o)===norm(l))).length;if(added)earn(added,'New connections');save();openItem(id)}
function removeItem(id){if(confirm('Remove this from the Garden?')){state.items=state.items.filter(x=>x.id!==id);save();closeAll()}}
function openLibrary(tab='finished',q='',filter='all'){let books=state.items.filter(x=>x.type==='book'),finished=books.filter(x=>x.bookStatus==='finished'),tbr=books.filter(x=>x.bookStatus!=='finished'),arr=tab==='finished'?finished:tbr;if(q){let n=norm(q);arr=arr.filter(x=>norm([x.title,x.author,x.body,...allLinks(x)].join(' ')).includes(n))}if(filter!=='all')arr=arr.filter(x=>allLinks(x).some(l=>norm(l)===norm(filter)));let filters=unique(books.flatMap(allLinks)).slice(0,12);let content=arr.length?arr.map(x=>tab==='finished'?`<div class="card shelf click" onclick="openItem('${x.id}')"><div class="bookrow"><div><b>📕 ${esc(x.title)}</b><div class="muted">${esc(x.author||'Unknown author')}</div></div><span>›</span></div></div>`:`<div class="card click" onclick="openItem('${x.id}')"><div class="bookrow"><div><b>📚 ${esc(x.title)}</b><div class="muted">${esc(x.author||'Unknown author')}</div></div><span>›</span></div></div>`).join(''):`<div class="empty">${tab==='finished'?'No finished books yet.':'Your ugly TBR pile is currently empty.'}</div>`;show(`<h2>📚 The Library</h2><div class="sub">${finished.length} shelved · ${tbr.length} in the disgraceful pile</div><div class="tabs"><button class="${tab==='finished'?'on':''}" onclick="openLibrary('finished')">Finished shelves</button><button class="${tab==='tbr'?'on':''}" onclick="openLibrary('tbr')">Ugly TBR pile</button></div>${tab==='tbr'&&tbr.length?`<div class="pile">📚📕📗<br><span class="muted">This pile has ${tbr.length} book${tbr.length===1?'':'s'} and no dignity.</span></div>`:''}<div class="form"><input id="libsearch" placeholder="Search title, author, notes or connections" value="${esc(q)}" oninput="openLibrary('${tab}',this.value,'${esc(filter)}')"><select onchange="openLibrary('${tab}',document.getElementById('libsearch').value,this.value)"><option value="all">All connections</option>${filters.map(f=>`<option ${filter===f?'selected':''}>${esc(f)}</option>`).join('')}</select></div>${content}<div class="actions"><button onclick="closeAll()">Back</button><button class="primary" onclick="openPlant('book')">＋ Book</button></div>`)}
function openWorkshop(){let a=state.items.filter(x=>x.type==='project');show(`<h2>🛠️ Workshop</h2><div class="sub">Ideas become things here.</div>${a.length?a.map(x=>`<div class="card click" onclick="openItem('${x.id}')"><b>${esc(x.title)}</b><div class="muted">${projectLabel(x.projectStatus)}</div></div>`).join(''):'<div class="empty">No projects yet.</div>'}<div class="actions"><button onclick="closeAll()">Back</button><button class="primary" onclick="openPlant('project')">＋ Project</button></div>`)}
function openShop(cat='All'){let cats=['All',...unique(SHOP.map(x=>x.cat))],arr=cat==='All'?SHOP:SHOP.filter(x=>x.cat===cat);show(`<h2>🛒 Garden Shop</h2><div class="sub"><span class="money">🪙 ${state.balance}</span> available · buy now, place from Inventory later.</div><div class="tabs">${cats.map(c=>`<button class="${c===cat?'on':''}" onclick="openShop('${c.replace(/'/g,"\\'")}')">${esc(c)}</button>`).join('')}</div><div class="shopgrid">${arr.map(x=>`<div class="shopitem"><div class="emoji">${x.icon}</div><b>${esc(x.name)}</b><div class="money">🪙 ${x.price}</div><button class="choice" onclick="buy('${x.id}')" ${state.balance<x.price?'disabled':''}>Buy</button></div>`).join('')}</div><div class="actions"><button onclick="closeAll()">Back</button></div>`)}
function buy(id){let it=SHOP.find(x=>x.id===id);if(!it||state.balance<it.price)return toast('Not enough coins');state.balance-=it.price;let name=it.name;if(it.nameable){let n=prompt(`Name your ${it.name.toLowerCase()}?`,it.name);if(n)name=n.trim()}state.inventory.push({id:uuid(),itemId:id,name});state.log.unshift({at:Date.now(),msg:`Bought ${name} for ${it.price} coins`});save();openShop(it.cat);toast(`${it.icon} ${name} is in Inventory`)}
function openInventory(cat='All'){let cats=['All',...unique(state.inventory.map(x=>SHOP.find(s=>s.id===x.itemId)?.cat).filter(Boolean))],available=state.inventory.filter(x=>!state.placed.some(p=>p.inventoryId===x.id)),placed=state.inventory.filter(x=>state.placed.some(p=>p.inventoryId===x.id)),arr=cat==='All'?available:available.filter(x=>SHOP.find(s=>s.id===x.itemId)?.cat===cat);show(`<h2>🎒 Inventory</h2><div class="sub">${available.length} available · ${placed.length} placed. Moving and storing are always free.</div><div class="tabs">${cats.map(c=>`<button class="${c===cat?'on':''}" onclick="openInventory('${c.replace(/'/g,"\\'")}')">${esc(c)}</button>`).join('')}</div>${arr.length?arr.map(x=>{let it=SHOP.find(s=>s.id===x.itemId);return `<div class="card bookrow"><div><b>${it.icon} ${esc(x.name||it.name)}</b><div class="muted">${esc(it.cat)}</div></div><button class="choice primary" onclick="beginPlace('${x.id}')">Place</button></div>`}).join(''):'<div class="empty">Nothing waiting to be placed.</div>'}<h3>Placed</h3>${placed.length?placed.map(x=>{let it=SHOP.find(s=>s.id===x.itemId);return `<div class="card bookrow"><div>${it.icon} ${esc(x.name||it.name)}</div><button class="choice" onclick="focusPlaced('${x.id}')">Find</button></div>`}).join(''):'<div class="muted">Nothing placed yet.</div>'}<div class="actions"><button onclick="closeAll()">Back</button><button onclick="toggleEditWorld()">${editWorld?'✓ Finish editing':'✥ Edit world'}</button></div>`)}
function beginPlace(inventoryId){placing=inventoryId;closeAll();toast('Tap anywhere in the garden to place it')}
function focusPlaced(invId){let p=state.placed.find(x=>x.inventoryId===invId);if(!p)return;closeAll();pan.x=wrap.clientWidth/2-p.x*pan.scale;pan.y=wrap.clientHeight/2-p.y*pan.scale;applyTransform()}
function toggleEditWorld(){editWorld=!editWorld;save();closeAll();toast(editWorld?'Edit mode: tap an item to move/store it':'World locked')}
function placedMenu(id){let p=state.placed.find(x=>x.id===id),inv=state.inventory.find(x=>x.id===p.inventoryId),it=SHOP.find(x=>x.id===p.itemId);show(`<h2>${it.icon} ${esc(inv?.name||it.name)}</h2><div class="sub">Placed item</div><div class="actions"><button onclick="storePlaced('${id}')">Store in Inventory</button><button class="primary" onclick="movePlaced('${id}')">Move</button></div>`)}
function storePlaced(id){state.placed=state.placed.filter(x=>x.id!==id);save();closeAll();toast('Stored in Inventory')}
function movePlaced(id){let p=state.placed.find(x=>x.id===id);placing=p.inventoryId;state.placed=state.placed.filter(x=>x.id!==id);save();closeAll();toast('Tap the new location')}
function openSettings(){show(`<h2>⚙️ Connection shortcuts</h2><div class="sub">These are only quick buttons. They become ordinary [[wikilinks]] in your notes.</div>${Object.keys(TYPES).map(type=>`<div class="card"><b>${TYPES[type].icon} ${TYPES[type].label}</b><div class="chips">${(state.settings.suggest[type]||[]).map(x=>`<span class="tag">${esc(x)} <button onclick="removeSuggestion('${type}','${x.replace(/'/g,"\\'")}')">×</button></span>`).join('')}</div><div style="display:flex;gap:6px;margin-top:8px"><input id="set-${type}" placeholder="Add shortcut" style="flex:1;background:#101b15;color:white;border:1px solid #506b55;padding:8px"><button onclick="addSuggestion('${type}')">Add</button></div></div>`).join('')}<div class="actions"><button onclick="openMenu()">Back</button></div>`)}
function addSuggestion(type){let e=document.getElementById('set-'+type),v=e.value.trim();if(v&&!state.settings.suggest[type].some(x=>norm(x)===norm(v)))state.settings.suggest[type].push(v);save();openSettings()}
function removeSuggestion(type,v){state.settings.suggest[type]=state.settings.suggest[type].filter(x=>x!==v);save();openSettings()}
function openMenu(){show(`<h2>Garden shed</h2><div class="card click" onclick="openTodayJournal()">📓 <b>Today's journal</b><div class="muted">One entry per day, only if you choose to write one.</div></div><div class="card click" onclick="openSettings()">⚙️ <b>Connection shortcuts</b><div class="muted">Customise the clickable [[wikilink]] suggestions.</div></div><div class="card click" onclick="openLog()">🧾 <b>Coin ledger</b><div class="muted">Balance ${state.balance} · all-time earned ${state.totalEarned}</div></div><div class="card click" onclick="exportSave()">💾 <b>Export private backup</b></div><div class="card click" onclick="document.getElementById('importer').click()">📥 <b>Import backup</b></div><input id="importer" type="file" accept="application/json" style="display:none" onchange="importSave(event)"><div class="actions"><button onclick="closeAll()">Back</button></div>`)}
function openTodayJournal(){let x=state.items.find(i=>i.type==='journal'&&i.date===dayKey());x?openItem(x.id):openPlant('journal')}
function openLog(){show(`<h2>🧾 Coin ledger</h2><div class="card"><b class="money">🪙 ${state.balance} balance</b><div>🏦 ${state.totalEarned} all-time earned</div></div>${state.log.length?state.log.slice(0,60).map(l=>`<div class="card"><b>${esc(l.msg)}</b><div class="muted">${new Date(l.at).toLocaleString()}</div></div>`).join(''):'<div class="empty">Nothing yet.</div>'}<div class="actions"><button onclick="openMenu()">Back</button></div>`)}
function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`garden-backup-${dayKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup exported')}
function importSave(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.items))throw 0;if(confirm('Replace this phone’s current Garden with this backup?')){state=Object.assign(fresh(),d);save();closeAll();toast('Garden restored')}}catch{toast('That does not look like a Garden backup')}};r.readAsText(f)}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2000)}
function applyTransform(){document.getElementById('world').style.transform=`translate(${pan.x}px,${pan.y}px) scale(${pan.scale})`}
const wrap=document.getElementById('wrap');function fit(){let w=wrap.clientWidth,h=wrap.clientHeight;pan.scale=Math.min(.62,Math.max(.35,Math.min(w/1800,h/1200)*1.75));pan.x=(w-1800*pan.scale)/2;pan.y=(h-1200*pan.scale)/2;applyTransform()}
wrap.addEventListener('pointerdown',e=>{if(placing){let rect=wrap.getBoundingClientRect(),x=(e.clientX-rect.left-pan.x)/pan.scale,y=(e.clientY-rect.top-pan.y)/pan.scale;let inv=state.inventory.find(i=>i.id===placing),it=SHOP.find(s=>s.id===inv?.itemId);if(inv&&it){state.placed.push({id:uuid(),inventoryId:inv.id,itemId:it.id,x:Math.max(35,Math.min(1765,x)),y:Math.max(35,Math.min(1165,y))});placing=null;save();toast(`${it.icon} placed`)}return}if(e.target.closest('.object,.building,.quick,.placed'))return;drag={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};wrap.setPointerCapture(e.pointerId)});
wrap.addEventListener('pointermove',e=>{if(!drag)return;pan.x=drag.px+e.clientX-drag.x;pan.y=drag.py+e.clientY-drag.y;applyTransform()});wrap.addEventListener('pointerup',()=>drag=null);window.addEventListener('resize',fit);render();setTimeout(fit,40);
</script></body></html>
