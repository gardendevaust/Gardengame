<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17261e"><title>My Garden V2</title>
<style>
:root{--ink:#f6ecd4;--panel:#18271f;--panel2:#22372b;--line:#496650;--gold:#f2c66d;--muted:#a8b9aa;--dark:#0d1712}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--dark);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}.hud{display:flex;background:#18271f;border-bottom:2px solid #314a39;padding:calc(6px + env(safe-area-inset-top)) 6px 6px;z-index:5}.stat{flex:1;text-align:center;border-right:1px solid #38513f;padding:3px}.stat:last-child{border:0}.stat b{display:block;color:#fff0c7;font-size:14px}.stat small{color:#9fb1a2;font-size:8px}.worldwrap{position:relative;overflow:hidden;touch-action:none;background:#294534}.world{position:absolute;width:1500px;height:1000px;transform-origin:0 0;background:linear-gradient(#3e7149,#4b7c4d);overflow:hidden}.world:before{content:"";position:absolute;inset:0;opacity:.12;background-image:linear-gradient(45deg,#173423 25%,transparent 25%),linear-gradient(-45deg,#173423 25%,transparent 25%);background-size:22px 22px}.path{position:absolute;background:#c9aa76;border:4px solid #987b52;border-radius:40px}.p1{left:130px;top:410px;width:1180px;height:48px;transform:rotate(2deg)}.p2{left:720px;top:120px;width:50px;height:720px;transform:rotate(-4deg)}.pond{position:absolute;left:625px;top:455px;width:255px;height:135px;border-radius:50%;background:#4b95a6;border:7px solid #32666a}.zone{position:absolute;border:3px dashed rgba(255,255,255,.12);border-radius:28px}.zt{position:absolute;top:-20px;left:14px;background:#21392a;border:2px solid #526f55;padding:4px 8px;border-radius:5px;font-size:11px;color:#f7df9f;box-shadow:3px 3px #17251c}.people{left:80px;top:100px;width:410px;height:270px}.moments{left:80px;top:520px;width:410px;height:300px}.botanical{left:540px;top:95px;width:390px;height:280px}.thoughts{left:1000px;top:520px;width:390px;height:300px}.journal{left:540px;top:690px;width:390px;height:190px}.building{position:absolute;border:7px solid #3c2c25;box-shadow:7px 7px #18251c;border-radius:5px;text-align:center;color:#38281f}.building .sign{position:absolute;left:50%;transform:translateX(-50%);top:10px;white-space:nowrap;background:#e5c888;border:3px solid #6e4e36;padding:4px 9px;font-weight:bold;font-size:10px}.library{left:1050px;top:120px;width:220px;height:175px;background:#78503a}.library:after{content:"📚";font-size:68px;position:absolute;left:70px;top:55px}.greenhouse{left:1280px;top:135px;width:175px;height:155px;background:#7fb4a0aa;border-color:#456f60}.greenhouse:after{content:"🌱❓🌿";font-size:32px;position:absolute;left:22px;top:65px}.workshop{left:1030px;top:330px;width:230px;height:150px;background:#896b47}.workshop:after{content:"🛠️ ✂️ ✏️";font-size:32px;position:absolute;left:34px;top:62px}.object{position:absolute;transform:translate(-50%,-50%);filter:drop-shadow(3px 4px rgba(12,22,16,.5));user-select:none}.object button{border:0;background:none;font-size:45px;padding:4px;min-width:52px;min-height:52px}.object.tree button{font-size:76px}.label{position:absolute;left:50%;top:48px;transform:translateX(-50%);white-space:nowrap;background:#142019df;border:1px solid #4b674f;border-radius:5px;padding:3px 5px;font-size:8px;max-width:110px;overflow:hidden;text-overflow:ellipsis}.tree .label{top:72px}.fruit{position:absolute;font-size:16px;pointer-events:none}.f1{left:13px;top:10px}.f2{right:11px;top:18px}.f3{left:35px;top:0}.f4{right:32px;top:1px}.nav{display:grid;grid-template-columns:repeat(4,1fr);background:#142019;border-top:2px solid #314839;padding-bottom:env(safe-area-inset-bottom);z-index:8}.nav button{border:0;background:none;color:#dae4d7;min-height:54px;font-size:10px}.nav .plant{color:#ffd276;font-weight:bold}.quick{position:absolute;right:15px;bottom:15px;width:60px;height:60px;border-radius:50%;background:var(--gold);border:3px solid #806536;color:#30281b;font-size:28px;z-index:6;box-shadow:4px 4px #17241c}.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#142019dc;border:1px solid #506a54;border-radius:12px;padding:6px 10px;font-size:9px;z-index:5;pointer-events:none}.modalback{position:fixed;inset:0;background:#07100bdc;display:none;align-items:end;z-index:20}.modalback.show{display:flex}.modal{width:100%;max-height:90dvh;overflow:auto;background:#1c2d23;border-top:3px solid #526e57;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px #08100b}.modal h2{font-family:Georgia,serif;margin:0 0 5px;font-size:24px}.sub,.muted{color:var(--muted);font-size:11px}.form{display:grid;gap:13px;margin-top:15px}.form label{display:grid;gap:5px;font-size:11px}.form input,.form textarea,.form select{width:100%;font-size:16px;background:#101b15;color:var(--ink);border:2px solid #415e49;border-radius:8px;padding:12px}.form textarea{min-height:105px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.chip{border:1px solid #58745d;background:#294334;color:#e8eadf;border-radius:16px;padding:7px 10px;font-size:11px}.chip.on{background:#e6bd68;color:#2b2519;border-color:#806536}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;position:sticky;bottom:0;background:#1c2d23;padding-top:8px}.actions button,.choice{min-height:44px;border:2px solid #54715a;border-radius:8px;background:#294535;color:#f5ead2;padding:9px 12px}.actions .primary{background:#e9bd62;color:#292217;border-color:#806532}.card{background:#142019;border:1px solid #3d5643;border-radius:8px;padding:12px;margin:9px 0}.tag{display:inline-block;background:#2b4636;border:1px solid #54715a;border-radius:12px;padding:4px 7px;font-size:10px;margin:2px}.empty{text-align:center;color:#9aab9c;padding:28px 8px}.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(100px);background:#efc568;color:#292217;border:3px solid #795f33;border-radius:9px;padding:10px 14px;z-index:30;font-weight:bold;transition:.25s;max-width:90%;text-align:center}.toast.show{transform:translateX(-50%) translateY(0)}.danger{color:#ffc0b5}.filename{font-size:10px;color:#d7c99e;margin-top:5px}.quote{font-family:Georgia,serif;font-size:16px;line-height:1.4}@media(min-width:800px){.modalback{align-items:center;justify-content:center;padding:20px}.modal{width:min(650px,100%);border:3px solid #526e57;border-radius:14px}.nav{grid-template-columns:repeat(4,140px);justify-content:center}.hud{justify-content:center}.stat{max-width:180px}}
</style></head><body><div class="app"><div class="hud"><div class="stat"><b id="streak">🔥 0 days</b><small>streak</small></div><div class="stat"><b id="count">0</b><small>specimens</small></div><div class="stat"><b id="xp">0 XP</b><small>garden XP</small></div><div class="stat"><b id="level">Lv. 1</b><small>level</small></div></div><div class="worldwrap" id="wrap"><div class="world" id="world"><div class="path p1"></div><div class="path p2"></div><div class="pond"></div><div class="zone people"><span class="zt">🌳 PEOPLE ORCHARD</span></div><div class="zone moments"><span class="zt">🌺 MOMENTS & QUOTES</span></div><div class="zone botanical"><span class="zt">🌿 BOTANICAL GARDEN · LEARNING</span></div><div class="zone thoughts"><span class="zt">🍄 THOUGHTS</span></div><div class="zone journal"><span class="zt">🌼 JOURNAL MEADOW</span></div><div class="building library" onclick="openCollection('book')"><span class="sign">THE LIBRARY</span></div><div class="building greenhouse" onclick="openCollection('question')"><span class="sign">GREENHOUSE · QUESTIONS</span></div><div class="building workshop" onclick="openCollection('project')"><span class="sign">WORKSHOP · PROJECTS</span></div><div id="objects"></div></div><div class="hint" id="hint">Drag to wander · pinch to zoom</div><button class="quick" onclick="openPlant()">＋</button></div><nav class="nav"><button onclick="fit()">🏡<br>Garden</button><button class="plant" onclick="openPlant()">🌱<br>Plant</button><button onclick="roulette()">🎲<br>Roulette</button><button onclick="openMenu()">☰<br>More</button></nav></div><div class="modalback" id="modalback"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const TYPES={person:{label:'Person',icon:'🌳',zone:'people',prefix:''},moment:{label:'Moment',icon:'🌺',zone:'moments',prefix:'Moment – '},quote:{label:'Quote',icon:'💬',zone:'moments',prefix:'Quote – '},thought:{label:'Thought',icon:'🍄',zone:'thoughts',prefix:'Thought – '},learning:{label:'Something I learned',icon:'🌿',zone:'botanical',prefix:'Learning – '},question:{label:'Question',icon:'❓',zone:'greenhouse',prefix:'Question – '},project:{label:'Project / creation',icon:'🛠️',zone:'workshop',prefix:'Project – '},book:{label:'Book',icon:'📕',zone:'library',prefix:'Book – '},journal:{label:'Journal',icon:'🌼',zone:'journal',prefix:'Journal – '}};
const SUGGEST={person:['Family','Friends','Work'],moment:['Funny','Sweet','Weird','Chaotic','Awkward','Important','Family','Friends','Parenting','Work','Self'],quote:['Funny','Sweet','Weird','Chaotic','Kids','Family','Friends','Work'],thought:['Self','People','Society','Language','Art','Pop Culture','Work','Parenting','Wordplay'],learning:['Science','History','Art','Pop Culture','Language','Psychology','Society','Technology','Food','Culture'],question:['Science','History','Art','Pop Culture','Language','Psychology','Society','Technology','Self'],project:['Art','Writing','Zines','Home','Work','Self'],book:['Fiction','Non-fiction','History','Science','Art','Pop Culture','Psychology','Society'],journal:['Self','Family','Friends','Parenting','Work','Art']};
const bounds={people:[130,450,140,335],moments:[130,450,560,790],botanical:[585,890,140,335],thoughts:[1040,1350,560,790],journal:[590,890,725,850]};
let state=load(),selected=[],pan={x:0,y:0,scale:.65},drag=null;
function fresh(){return {items:[],xp:0,days:[],achievements:[],log:[]}}
function load(){try{return JSON.parse(localStorage.getItem('gardenGameV2'))||fresh()}catch{return fresh()}}
function save(){localStorage.setItem('gardenGameV2',JSON.stringify(state));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function dayKey(d=new Date()){return d.toLocaleDateString('en-CA')}
function gardenDay(){let d=dayKey();if(!state.days.includes(d))state.days.push(d)}
function streak(){let set=new Set(state.days),n=0,d=new Date();while(set.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n}
function earn(n,msg){state.xp+=n;gardenDay();state.log.unshift({at:Date.now(),msg:`+${n} XP — ${msg}`});toast(`+${n} XP · ${msg}`)}
function render(){document.getElementById('count').textContent=state.items.length;document.getElementById('xp').textContent=state.xp+' XP';document.getElementById('level').textContent='Lv. '+(Math.floor(state.xp/100)+1);let s=streak();document.getElementById('streak').textContent=`🔥 ${s} day${s===1?'':'s'}`;renderObjects();applyTransform()}
function hash(s){let h=0;for(let c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function pos(item){let b=bounds[TYPES[item.type]?.zone]||bounds.thoughts,h=hash(item.id);return{x:b[0]+(h%1000)/1000*(b[1]-b[0]),y:b[2]+((Math.floor(h/1000)%1000)/1000)*(b[3]-b[2])}}
function norm(s){return s.trim().toLowerCase()}
function fruitFor(person){return state.items.filter(x=>['moment','quote','journal'].includes(x.type)&&(x.links||[]).some(l=>norm(l)===norm(person.title)))}
function renderObjects(){let el=document.getElementById('objects');el.innerHTML='';state.items.filter(x=>!['book','question','project'].includes(x.type)).forEach(item=>{let p=pos(item),t=TYPES[item.type],d=document.createElement('div');d.className='object '+(item.type==='person'?'tree':'');d.style.left=p.x+'px';d.style.top=p.y+'px';let fruits='';if(item.type==='person')fruitFor(item).slice(0,4).forEach((_,i)=>fruits+=`<span class="fruit f${i+1}">🍎</span>`);d.innerHTML=`<button>${t.icon}</button>${fruits}<div class="label">${esc(item.title)}</div>`;d.onclick=e=>{e.stopPropagation();openItem(item.id)};el.appendChild(d)})}
function show(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalback').classList.add('show')}
function closeAll(){document.getElementById('modalback').classList.remove('show')}
document.getElementById('modalback').onclick=e=>{if(e.target.id==='modalback')closeAll()}
function openPlant(){selected=[];let opts=Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.icon} ${v.label}</option>`).join('');show(`<h2>Plant something 🌱</h2><div class="sub">Choose what it is. Connections can be suggested or completely your own.</div><div class="form"><label>Type<select id="ptype" onchange="refreshSuggestions()">${opts}</select></label><label>Title<input id="ptitle" placeholder="Short, distinctive title"></label><label id="whoWrap" style="display:none">Who said it?<input id="pwho" placeholder="Person name"></label><label>What do you want to keep?<textarea id="pbody" placeholder="One sentence is enough."></textarea></label><div><label>Suggested connections</label><div class="chips" id="chips"></div></div><label>Add your own connection<input id="customLink" placeholder="e.g. New Zealand" onkeydown="if(event.key==='Enter'){event.preventDefault();addCustom()}"></label><div class="chips" id="chosen"></div><div class="filename" id="filename"></div></div><div class="actions"><button onclick="closeAll()">Cancel</button><button class="primary" onclick="plant()">Plant it</button></div>`);document.getElementById('ptitle').addEventListener('input',previewFilename);refreshSuggestions()}
function refreshSuggestions(){let type=document.getElementById('ptype').value;document.getElementById('whoWrap').style.display=type==='quote'?'grid':'none';document.getElementById('chips').innerHTML=(SUGGEST[type]||[]).map(x=>`<button class="chip ${selected.includes(x)?'on':''}" onclick="toggleLink('${x.replace(/'/g,"\\'")}')">${esc(x)}</button>`).join('');renderChosen();previewFilename()}
function toggleLink(x){selected.includes(x)?selected=selected.filter(a=>a!==x):selected.push(x);refreshSuggestions()}
function addCustom(){let el=document.getElementById('customLink'),x=el.value.trim();if(x&&!selected.some(a=>norm(a)===norm(x)))selected.push(x);el.value='';refreshSuggestions()}
function renderChosen(){let e=document.getElementById('chosen');if(e)e.innerHTML=selected.map(x=>`<button class="chip on" onclick="toggleLink('${x.replace(/'/g,"\\'")}')">[[${esc(x)}]] ×</button>`).join('')}
function filenameFor(type,title){if(type==='journal')return `Journal – ${new Date().toLocaleDateString('en-CA')}.md`;return (TYPES[type].prefix+title+'.md').replace(/[\\/:*?"<>|]/g,'-')}
function previewFilename(){let type=document.getElementById('ptype')?.value,title=document.getElementById('ptitle')?.value.trim();let e=document.getElementById('filename');if(e)e.textContent=title?`Obsidian filename: ${filenameFor(type,title)}`:''}
function plant(){addCustom();let type=document.getElementById('ptype').value,title=document.getElementById('ptitle').value.trim(),body=document.getElementById('pbody').value.trim();if(!title&&type!=='journal')return toast('Give it a title');if(type==='journal'&&!title)title=new Date().toLocaleDateString('en-CA');let links=[...selected];if(type==='quote'){let who=document.getElementById('pwho').value.trim();if(who&&!links.some(x=>norm(x)===norm(who)))links.unshift(who)}let item={id:crypto.randomUUID(),type,title,body,links,created:Date.now(),lastTended:Date.now(),filename:filenameFor(type,title)};state.items.push(item);earn(type==='person'?8:5,`${TYPES[type].label} planted`);save();closeAll();setTimeout(()=>openItem(item.id),180)}
function openItem(id){let x=state.items.find(i=>i.id===id);if(!x)return,t=TYPES[x.type];let links=(x.links||[]).map(l=>`<span class="tag">[[${esc(l)}]]</span>`).join('')||'<span class="muted">No connections yet.</span>';let fruit='';if(x.type==='person'){let fs=fruitFor(x);fruit=`<div class="card"><b>🍎 ${fs.length} story fruit</b>${fs.map(f=>`<div style="margin-top:8px" onclick="openItem('${f.id}')">🍎 ${esc(f.title)} <span class="muted">· ${TYPES[f.type].label}</span></div>`).join('')||'<div class="muted" style="margin-top:8px">Moments, quotes and journal entries linked to this person will grow here.</div>'}</div>`}show(`<h2>${t.icon} ${esc(x.title)}</h2><div class="sub">${t.label}</div><div class="filename">${esc(x.filename||filenameFor(x.type,x.title))}</div><div class="card ${x.type==='quote'?'quote':''}">${esc(x.body||'Nothing else written yet.').replace(/\n/g,'<br>')}</div><div>${links}</div>${fruit}<div class="actions"><button class="danger" onclick="removeItem('${id}')">Remove</button><button onclick="editItem('${id}')">Edit</button><button class="primary" onclick="tend('${id}')">💧 Tend</button></div>`)}
function tend(id){let x=state.items.find(i=>i.id===id);x.lastTended=Date.now();earn(3,'Tended');save();openItem(id)}
function editItem(id){let x=state.items.find(i=>i.id===id);selected=[...(x.links||[])];show(`<h2>Edit ${esc(TYPES[x.type].label)}</h2><div class="form"><label>Title<input id="etitle" value="${esc(x.title)}"></label><label>Notes<textarea id="ebody">${esc(x.body||'')}</textarea></label><label>Connections<input id="elinks" value="${esc((x.links||[]).join(', '))}"></label></div><div class="actions"><button onclick="openItem('${id}')">Cancel</button><button class="primary" onclick="saveEdit('${id}')">Save</button></div>`)}
function saveEdit(id){let x=state.items.find(i=>i.id===id);x.title=document.getElementById('etitle').value.trim()||x.title;x.body=document.getElementById('ebody').value;x.links=document.getElementById('elinks').value.split(',').map(a=>a.trim()).filter(Boolean);x.filename=filenameFor(x.type,x.title);x.lastTended=Date.now();earn(4,'Expanded');save();openItem(id)}
function removeItem(id){if(confirm('Remove this from the Garden?')){state.items=state.items.filter(x=>x.id!==id);save();closeAll()}}
function openCollection(type){let a=state.items.filter(x=>x.type===type),t=TYPES[type];show(`<h2>${t.icon} ${type==='book'?'The Library':type==='question'?'The Greenhouse':'The Workshop'}</h2><div class="sub">${type==='question'?'Questions live here while you cultivate them.':type==='project'?'Things you might make, build or do.':'Books live on the shelves rather than pretending to be plants.'}</div>${a.length?a.map(x=>`<div class="card" onclick="openItem('${x.id}')"><b>${t.icon} ${esc(x.title)}</b><div class="muted">${esc(x.body||'')}</div></div>`).join(''):'<div class="empty">Nothing here yet.</div>'}<div class="actions"><button onclick="closeAll()">Back</button><button class="primary" onclick="openPlant()">＋ Add</button></div>`)}
function roulette(){let a=state.items;if(!a.length)return show(`<h2>🎲 Garden Roulette</h2><div class="empty">There is nothing to rediscover yet. Plant your first thing.</div><div class="actions"><button class="primary" onclick="openPlant()">🌱 Plant something</button></div>`);let x=a[Math.floor(Math.random()*a.length)];show(`<h2>🎲 Garden Roulette</h2><div class="sub">The garden picked this.</div><div class="card"><b>${TYPES[x.type].icon} ${esc(x.title)}</b><p>${esc(x.body||'')}</p></div><div class="actions"><button onclick="roulette()">Again</button><button class="primary" onclick="openItem('${x.id}')">Visit →</button></div>`)}
function openMenu(){show(`<h2>Garden shed</h2><div class="card" onclick="openLog()">📓 <b>Garden log</b><div class="muted">Recent activity</div></div><div class="card" onclick="exportSave()">💾 <b>Export private backup</b><div class="muted">Download your Garden data as JSON.</div></div><div class="card" onclick="document.getElementById('importer').click()">📥 <b>Import backup</b><div class="muted">Restore a Garden JSON file.</div></div><input id="importer" type="file" accept="application/json" style="display:none" onchange="importSave(event)"><div class="card"><b>🧠 V2 structure</b><div class="muted">People = trees · Moments/Quotes/Journal links = fruit · Learning = botanical garden · Questions = greenhouse · Projects = workshop · Books = library.</div></div><div class="actions"><button onclick="closeAll()">Back</button></div>`)}
function openLog(){show(`<h2>📓 Garden log</h2>${state.log.length?state.log.slice(0,30).map(l=>`<div class="card"><b>${esc(l.msg)}</b><div class="muted">${new Date(l.at).toLocaleString()}</div></div>`).join(''):'<div class="empty">Nothing yet. This Garden starts completely empty.</div>'}<div class="actions"><button onclick="openMenu()">Back</button></div>`)}
function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`garden-backup-${dayKey()}.json`;a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function importSave(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.items))throw 0;if(confirm('Replace this phone’s current Garden with this backup?')){state=d;save();closeAll();toast('Garden restored')}}catch{toast('That does not look like a Garden backup')}};r.readAsText(f)}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1800)}
function applyTransform(){document.getElementById('world').style.transform=`translate(${pan.x}px,${pan.y}px) scale(${pan.scale})`}
const wrap=document.getElementById('wrap');function fit(){let w=wrap.clientWidth,h=wrap.clientHeight;pan.scale=Math.min(.82,w/1500,h/1000)*1.8;pan.scale=Math.min(.78,Math.max(.42,pan.scale));pan.x=(w-1500*pan.scale)/2;pan.y=(h-1000*pan.scale)/2;applyTransform()}
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.object,.building,.quick'))return;drag={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};document.getElementById('hint').style.opacity=.15;wrap.setPointerCapture(e.pointerId)});wrap.addEventListener('pointermove',e=>{if(!drag)return;pan.x=drag.px+e.clientX-drag.x;pan.y=drag.py+e.clientY-drag.y;applyTransform()});wrap.addEventListener('pointerup',()=>drag=null);window.addEventListener('resize',fit);render();setTimeout(fit,40);
</script></body></html>
